xwayland disable

output HEADLESS-1 resolution 1024x768 position 0,0
output * bg /usr/share/backgrounds/sway/Sway_Wallpaper_Blue_768x1024.png fill

default_border pixel 1

# Workaround: `wayvnc` creates a virtual keyboard per VNC client, but when the active keyboard is
# removed (e.g. an older VNC client disconnects while a newer one stays connected), sway doesn't
# make one of the remaining keyboards active, which causes a crash in Chromium/Electron.
# Reconfiguring the keyboards (with sway's default repeat delay) makes one of them active.
exec swaymsg -r -m -t subscribe '["input"]' | grep --line-buffered -o removed | xargs -I % swaymsg input type:keyboard repeat_delay 600 > /dev/null

include /etc/sway/config.d/*
