<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  D-Bus system bus for the devcontainer, started by `start.sh` as the non-root user.

  It doesn't provide any services. It only exists so that clients looking for a system service get a
  "service unknown" error instead of failing to connect.
-->
<busconfig>
  <type>system</type>
  <!-- Overridden by `start.sh` with `DBUS_SYSTEM_BUS_ADDRESS`, but required by `dbus-daemon`. -->
  <listen>unix:path=/tmp/dbus-system.sock</listen>
  <auth>EXTERNAL</auth>
  <!-- Same permissive policy as the session bus. -->
  <policy context="default">
    <allow send_destination="*" eavesdrop="true"/>
    <allow eavesdrop="true"/>
    <allow own="*"/>
  </policy>
</busconfig>
