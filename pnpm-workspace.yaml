packages:
  - apps/*
  - packages/*

allowBuilds:
  '@swc/core': true
  '@threema/eslint-plugin-threema': true
  'argon2@https://codeload.github.com/threema-ch/node-argon2/tar.gz/d25269c471b3ece9831662fab366db531e9cfc90': true
  'better-sqlcipher@https://codeload.github.com/threema-ch/better-sqlcipher/tar.gz/e74f8b8d8fa5d000071f3e433adbd255fde84a4a': true
  electron: true
  esbuild: true
  eslint-plugin-threema: true
  fs-xattr: true
  macos-alias: true
  protobufjs: true
  svelte-preprocess: true

catalog:
  '@badrap/valita': 0.4.6
  '@eslint/js': ~9.34.0
  '@playwright/test': 1.56.1
  '@prettier/plugin-xml': 3.4.2
  '@sveltejs/vite-plugin-svelte': 6.2.4
  '@storybook/addon-docs': 10.3.4
  '@storybook/addon-svelte-csf': 5.1.2
  '@storybook/svelte-vite': 10.3.4
  '@tailwindcss/vite': 4.2.1
  '@types/debug': ~4.1.12
  '@types/node': ~24.19.2
  '@typescript-eslint/eslint-plugin': ~8.42.0
  '@typescript-eslint/parser': ~8.42.0
  '@typescript-eslint/rule-tester': ~8.42.0
  '@typescript-eslint/types': ~8.42.0
  '@typescript-eslint/utils': ~8.42.0
  '@vitest/browser-playwright': 4.1.10
  '@vitest/coverage-istanbul': 4.1.10
  'vitest-browser-svelte': ~2.0.2
  debug: ~4.4.1
  eslint-plugin-svelte: ~3.17.0
  eslint-plugin-storybook: 10.3.4
  eslint: ~9.34.0
  globals: 16.3.0
  i18next-cli: ~1.76.0
  long: 5.3.2
  playwright: 1.56.1
  prettier-plugin-svelte: 3.5.1
  prettier-plugin-tailwindcss: 0.7.2
  prettier: 3.6.2
  protobufjs: 7.6.5
  storybook: 10.3.4
  svelte-check: 4.4.6
  svelte-eslint-parser: 1.6.0
  svelte: 5.55.10
  tailwind-merge: ~3.5.0
  tailwind-variants: ~3.2.2
  tailwindcss: 4.2.1
  tweetnacl: 1.0.3
  typescript-eslint: ~8.42.0
  typescript: ~5.9.2
  vite-plugin-istanbul: 7.1.0
  vite-tsconfig-paths: 5.1.4
  vite: 7.3.6
  vitest: 4.1.10

engineStrict: true

minimumReleaseAge: 10080

minimumReleaseAgeExclude:
  - '@threema/*'

minimumReleaseAgeStrict: true

overrides:
  "@electron/rebuild>node-abi": "4.17.0"

pmOnFail: error

publicHoistPattern:
  - '@phc/format'
  - '*eslint*'
  - resolve

savePrefix: ''

verifyDepsBeforeRun: warn

virtualStoreDirMaxLength: 8
